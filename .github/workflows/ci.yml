name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: format, lint, tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install the project and its dev extras
        run: uv sync --extra dev

      # Exit codes decide pass/fail. Each gate runs even if an earlier one failed,
      # so one report shows every problem rather than only the first.
      - name: ruff format --check
        if: '!cancelled()'
        run: uv run ruff format --check .

      - name: ruff check
        if: '!cancelled()'
        run: uv run ruff check .

      # The suite is offline by construction: it starts real subprocesses and real
      # loopback HTTP servers, and reaches no external host.
      #
      # No -q here: pyproject already sets addopts = "-q", and a second one makes it
      # -qq, which suppresses the summary line entirely. A CI log that cannot show
      # how many tests ran cannot distinguish a green suite from one that collected
      # nothing.
      - name: pytest
        if: '!cancelled()'
        run: uv run pytest
