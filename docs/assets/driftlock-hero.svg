<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">driftlock — checkpoint, detect drift, roll back, learn</title>
  <desc id="desc">A dark research-style banner with the driftlock wordmark, a checkpoint timeline, a detected drift path, and a rollback loop returning to a healthy checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="1172" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="0.52" stop-color="#0C1C2D"/>
      <stop offset="1" stop-color="#071B18"/>
    </linearGradient>
    <linearGradient id="word" x1="71" y1="110" x2="570" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#C8E7E0"/>
    </linearGradient>
    <linearGradient id="safe" x1="714" y1="317" x2="1080" y2="317" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="drift" x1="827" y1="304" x2="1008" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(908 236) rotate(90) scale(216)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="908" cy="236" r="216" fill="url(#glow)"/>
    <circle cx="104" cy="15" r="205" fill="#38BDF8" fill-opacity="0.045"/>

    <text x="76" y="84" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="3">LONG-HORIZON AGENT RUNTIME</text>
    <text x="69" y="207" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="101" font-weight="800" letter-spacing="-6">driftlock</text>
    <text x="77" y="252" fill="#AFC3D5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Checkpoint. Detect drift. Roll back. Learn.</text>

    <g transform="translate(77 302)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">
      <g><rect width="136" height="38" rx="19" fill="#38BDF8" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.3"/><circle cx="20" cy="19" r="4" fill="#7DD3FC"/><text x="34" y="24" fill="#E0F2FE">CHECKPOINT</text></g>
      <g transform="translate(149)"><rect width="122" height="38" rx="19" fill="#F59E0B" fill-opacity="0.09" stroke="#FBBF24" stroke-opacity="0.3"/><circle cx="20" cy="19" r="4" fill="#FBBF24"/><text x="34" y="24" fill="#FEF3C7">DETECT</text></g>
      <g transform="translate(284)"><rect width="132" height="38" rx="19" fill="#34D399" fill-opacity="0.09" stroke="#6EE7B7" stroke-opacity="0.3"/><circle cx="20" cy="19" r="4" fill="#6EE7B7"/><text x="34" y="24" fill="#D1FAE5">ROLLBACK</text></g>
      <g transform="translate(429)"><rect width="112" height="38" rx="19" fill="#A78BFA" fill-opacity="0.09" stroke="#C4B5FD" stroke-opacity="0.3"/><circle cx="20" cy="19" r="4" fill="#C4B5FD"/><text x="34" y="24" fill="#EDE9FE">LEARN</text></g>
    </g>

    <g transform="translate(75 393)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <circle cx="4" cy="-4" r="4" fill="#34D399"/>
      <text x="17" fill="#94A3B8">STDLIB-ONLY RUNTIME</text>
      <circle cx="215" cy="-4" r="4" fill="#34D399"/>
      <text x="228" fill="#94A3B8">MEASURED, NOT CLAIMED</text>
    </g>

    <g transform="translate(687 74)">
      <rect x="0" y="0" width="431" height="292" rx="22" fill="#0F2530" fill-opacity="0.58" stroke="#94A3B8" stroke-opacity="0.13"/>
      <text x="27" y="38" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">TRAJECTORY / 08:14:32</text>
      <path d="M38 236H391" stroke="#334155" stroke-width="2"/>
      <path d="M53 236H321" stroke="url(#safe)" stroke-width="3" stroke-linecap="round"/>

      <g fill="#0F2530" stroke-width="3">
        <circle cx="53" cy="236" r="9" stroke="#38BDF8"/>
        <circle cx="142" cy="236" r="9" stroke="#38BDF8"/>
        <circle cx="231" cy="236" r="11" stroke="#34D399" filter="url(#softGlow)"/>
        <circle cx="321" cy="236" r="9" stroke="#34D399"/>
        <circle cx="391" cy="236" r="9" stroke="#475569"/>
      </g>
      <text x="207" y="274" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">LAST HEALTHY</text>

      <path d="M231 236C279 223 301 184 318 153C336 120 367 98 400 103" stroke="url(#drift)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
      <circle cx="400" cy="103" r="11" fill="#FB7185" fill-opacity="0.13" stroke="#FB7185" stroke-width="3"/>
      <path d="M396 99L404 107M404 99L396 107" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
      <text x="302" y="83" fill="#FDA4AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">DRIFT DETECTED</text>

      <path d="M395 121C405 179 362 211 249 226" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
      <path d="M257 217L246 227L260 232" stroke="#6EE7B7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="337" y="191" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">ROLLBACK</text>

      <g transform="translate(48 68)" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="20" width="74" height="57" rx="13" stroke-opacity="0.72"/>
        <path d="M18 20V14C18 -5 56-5 56 14V20" stroke-opacity="0.72"/>
        <path d="M37 41V57"/>
        <circle cx="37" cy="39" r="4" fill="#7DD3FC" stroke="none"/>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="27.25" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
