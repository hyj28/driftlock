[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftlock"
version = "0.1.0"
description = "A long-horizon coding agent that checkpoints its work, rolls back when it drifts, and validates the skills it distils"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "driftlock contributors" }]
keywords = ["agents", "llm", "checkpointing", "rollback", "self-improvement", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/hyj28/driftlock"
Results = "https://github.com/hyj28/driftlock/blob/main/RESULTS.md"
Architecture = "https://github.com/hyj28/driftlock/blob/main/docs/architecture.md"
Changelog = "https://github.com/hyj28/driftlock/blob/main/CHANGELOG.md"

[project.scripts]
driftlock-lhtb = "driftlock.lhtb_experiment:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/driftlock"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
